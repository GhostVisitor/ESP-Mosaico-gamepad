; ============================================================================
;  ESP-Mosaico 两用游戏手柄 —— 12 键面板 / USB HID 手柄 + 串口上报
; ----------------------------------------------------------------------------
;  平台(platform) : unit_ch55x  (SDCC + 厂商库)
;  开发板(board)  : unit_ch552   (CH552T 是 CH552 的 TSSOP-20 封装)
;
;  命令:
;    pio run              编译
;    pio run -t size      查看占用
;    pio run -t clean     清理
;    pio run -t upload    烧录(先 D+/P3.6 上拉 10k 到 5V 进 bootloader)
;
;  时钟固定 16 MHz 内部振荡器(USB 需要固定的 48 MHz 派生时钟,不能随意改)
; ============================================================================

[platformio]
src_dir = src

[env:ch552t]
platform = unit_ch55x
board    = unit_ch552
board_build.f_cpu = 16000000
